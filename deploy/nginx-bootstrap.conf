# ============================================================
#  Übergangs-Konfiguration nur für den ersten Zertifikatslauf.
#
#  Henne-Ei-Problem: die richtige Konfiguration verweist auf
#  TLS-Zertifikate, die es beim ersten Mal noch nicht gibt.
#  nginx -t schlägt dann fehl und certbot kommt nicht durch.
#
#  Deshalb: erst diese Datei einspielen, Zertifikat holen,
#  danach auf nginx-nbr.vfa-142.de.conf umstellen.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name nbr.vfa-142.de;

    # Hierhin legt certbot im Webroot-Modus seine Prüfdateien
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 200 "Grüne Hölle Academy — Einrichtung läuft.\n";
        add_header Content-Type text/plain;
    }
}

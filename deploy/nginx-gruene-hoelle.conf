# ============================================================
#  Grüne Hölle Academy — nginx Server-Block
#  Statische Web-App, kein Node, kein Build, kein Backend.
#
#  1. deine Domain unten bei server_name eintragen
#  2. Dateien nach /var/www/gruene-hoelle/ kopieren
#  3. TLS-Zertifikat holen:  sudo certbot --nginx -d ring.example.com
#     (certbot trägt die ssl_*-Zeilen automatisch ein, falls noch nicht da)
# ============================================================

# --- HTTP → HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name ring.example.com;          # <— ANPASSEN

    # Let's Encrypt Challenge weiter zulassen
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ring.example.com;          # <— ANPASSEN

    root /var/www/gruene-hoelle;
    index index.html;

    # --- TLS (Pfade von certbot) ---
    ssl_certificate     /etc/letsencrypt/live/ring.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ring.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Kompression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # --- Sicherheits-Header ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Die App erzeugt Inline-Styles (style="…" in generiertem Markup),
    # deshalb ist 'unsafe-inline' für style-src nötig. Skripte laufen alle
    # aus eigenen Dateien, script-src bleibt daher strikt auf 'self'.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Caching ---
    # index.html nie hart cachen, sonst sehen Besucher nach einem Update
    # tagelang die alte Version.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # CSS/JS moderat cachen. Die Dateien haben keine Hashes im Namen,
    # deshalb bewusst kurz + Revalidierung statt "immutable".
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location ~* \.(svg|png|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # --- Routing ---
    # Die App nutzt Hash-Routing (#map, #game:quiz), deshalb braucht es
    # KEIN SPA-Fallback — jede URL ist real /index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Punktdateien blocken
    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/gruene-hoelle.access.log;
    error_log  /var/log/nginx/gruene-hoelle.error.log;
}

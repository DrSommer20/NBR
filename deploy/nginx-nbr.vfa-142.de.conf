# ============================================================
#  Grüne Hölle Academy — nginx für nbr.vfa-142.de
#
#  Statische Web-App + kleines Node-Backend für die Konten.
#  nginx liefert die Dateien aus, /api/ geht an den Node-Dienst
#  auf 127.0.0.1:8787 (der ist nach außen nicht erreichbar).
#
#  Einrichtung siehe deploy/DEPLOY.md
# ============================================================

# --- HTTP → HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name nbr.vfa-142.de;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# --- HTTPS ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nbr.vfa-142.de;

    root /var/www/nbr;
    index index.html;

    # certbot trägt diese Pfade beim ersten Lauf selbst ein
    ssl_certificate     /etc/letsencrypt/live/nbr.vfa-142.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nbr.vfa-142.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Kompression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;

    # --- Sicherheits-Header ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Die App erzeugt Inline-Styles (style="…" in generiertem Markup), deshalb
    # 'unsafe-inline' für style-src. Skripte laufen alle aus eigenen Dateien.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # ---------- API an das Node-Backend ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Das Backend liest daraus die echte Client-IP fürs Rate-Limit
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # Antworten der API nie zwischenspeichern
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # ---------- Statische Dateien ----------
    # index.html nie hart cachen, sonst hängen Besucher nach einem Update
    # tagelang auf der alten Version.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # CSS/JS haben keine Hashes im Dateinamen — deshalb kurz cachen und
    # revalidieren statt "immutable".
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location ~* \.(svg|png|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Serverinterna, Rohdaten und Skripte gehören nicht ins Web
    location ~ ^/(server|scripts|data|deploy)/ { return 404; }
    location ~ /\.            { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/nbr.access.log;
    error_log  /var/log/nginx/nbr.error.log;
}
